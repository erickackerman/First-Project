<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Local Photo Upload</title>
</head>
<body>
    <main>
        <h1>Private Local Photo Upload</h1>
        <p>This page is for your computer only. Uploads are saved in the local uploads folder.</p>
        <form id="local-upload-form">
            <label for="local-photo-file">Choose a photo</label>
            <input id="local-photo-file" type="file" accept="image/jpeg,image/png,image/webp" required>
            <button type="submit">Save Photo Locally</button>
        </form>
        <p id="local-upload-status" role="status" aria-live="polite"></p>
        <p id="local-upload-result"></p>
    </main>
    <script src="local-upload.js" defer></script>
</body>
</html>
